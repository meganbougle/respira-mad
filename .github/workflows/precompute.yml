# Computes our air and pollen forecasts and saves them on the "results" branch.
# The server (Render) only downloads and reads them (results.py): it never loads
# a model, which keeps it under the free plan's 512 MB.
#
# - air: every hour; pollen: once a day; or by hand (Actions tab -> Run workflow).
# - The results branch holds ONE commit, replaced each time, so the repository
#   does not grow every hour. Render deploys only from main, so this never
#   triggers a deploy.
# - If a part fails, precompute.py keeps its last good files and records the
#   failed attempt in status.json; the run is then marked as failed (red).
name: Precompute forecasts

on:
  schedule:
    - cron: "10 * * * *"      # air: every hour at :10 (UTC)
    - cron: "40 4 * * *"      # pollen: every day at 04:40 UTC (05:40 or 06:40 in Madrid)
  workflow_dispatch:
    inputs:
      part:
        description: "Which forecast to compute"
        type: choice
        options: [all, air, pollen]
        default: all

concurrency:
  group: precompute           # one run at a time, so two runs never overwrite each other
  cancel-in-progress: false

permissions:
  contents: write             # to push the results branch

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code (main)
        uses: actions/checkout@v4

      - name: Get the last results (if the results branch exists)
        run: |
          mkdir -p out
          if git fetch --depth=1 origin results; then
            git --work-tree=out checkout FETCH_HEAD -- .
          fi
          ls -la out

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # newest 3.13.x on the runner (3.13.1 is not prebuilt for its Ubuntu)
          cache: pip
          cache-dependency-path: requirements-precompute.txt

      - name: Install the model libraries
        run: pip install -r requirements-precompute.txt

      - name: Choose the part
        id: part
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then part="${{ inputs.part }}"
          elif [ "${{ github.event.schedule }}" = "40 4 * * *" ]; then part="pollen"
          else part="air"; fi
          echo "part=$part" >> "$GITHUB_OUTPUT"
          echo "Computing: $part"

      - name: Compute
        id: compute
        continue-on-error: true      # save status.json even if a part failed (the old files stay)
        run: python precompute.py ${{ steps.part.outputs.part }} --out out

      - name: Save the results branch (one commit, replaced each time)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b results
          git config user.name "respira-mad-bot"
          git config user.email "respira-mad-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Results: ${{ steps.part.outputs.part }} computed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" results

      - name: Mark the run as failed if a part failed
        if: steps.compute.outcome == 'failure'
        run: |
          echo "A part failed: the last good results were kept (see status.json on the results branch)."
          exit 1
