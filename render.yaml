# Render "Blueprint": tells render.com how to run the web app (api.py + static/).
# Free plan. Deploys again automatically after every push to GitHub.
services:
  - type: web
    name: respira-mad
    runtime: python
    plan: free
    region: frankfurt                 # the closest Render region to Madrid
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1   # one worker: each extra one would need its own copy of everything (memory)
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION           # the version the app was tested with
        value: 3.13.1
      # Optional: free key for the CARTO Positron basemap (carto.com/basemaps/apikey).
      # "sync: false" means the value is typed in Render's dashboard, never stored in git.
      - key: CARTO_BASEMAP_KEY
        sync: false
      # Secret key for the AI assistant. Typed in Render's dashboard, never stored in git.
      # Without it the app works normally and the assistant says it is not available.
      - key: ANTHROPIC_API_KEY
        sync: false
